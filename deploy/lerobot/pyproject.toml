[project]
name = "preflight-policy-server"
version = "0.1.0"
description = "The GR00T N1.7 policy server's environment (LeRobot 0.6.1), separate from the project's Python 3.13 env"
requires-python = "==3.12.*"
# pyzmq and msgpack: the policy server's wire protocol; mujoco and scipy: real_mix.py and diver.py train run here too
dependencies = ["lerobot[groot,training]==0.6.1", "pyzmq", "msgpack", "mujoco", "scipy"]

[tool.uv]
package = false
# The versions the A100's working environment (~/lerobot-n17) runs, so the image serves exactly what was benchmarked.
