[project]
name = "nebius-physical-ai"
version = "0.1.0"
description = "Nebius Global AI Hackathon — Physical AI track entry"
readme = "README.md"
authors = [{ name = "Charlene Leong", email = "charleneleong84@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.19",
    "rich>=14",
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "mujoco>=3.14.0",
    "pyzmq>=27.2.0",
    "msgpack>=1.2.3",
    "av>=19.0.0",
    "pyarrow>=25.0.1",
    "wandb[media]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "pre-commit>=4",
    "httpx2>=2.13.1",
]

[project.scripts]
npai = "nebius_physical_ai.cli:app"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
